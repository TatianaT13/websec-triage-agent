name: secret scan

on:
  push:
  pull_request:

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Runs the gitleaks CLI itself (via its official image), not the
      # third-party gitleaks-action wrapper - avoids that wrapper's
      # per-org license requirement and its Node-version deprecation risk,
      # for a feature (failing the build on a detected secret) we don't
      # need the wrapper's PR-comment bells and whistles for anyway.
      - name: Scan for leaked secrets
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:latest \
            detect --source /repo --verbose --redact
